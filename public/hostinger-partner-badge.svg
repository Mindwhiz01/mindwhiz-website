<svg viewBox="0 0 180 60" width="180" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="60" rx="12" fill="#673DE6"/>

  <!-- Hostinger Logo (H symbol) -->
  <g transform="translate(20, 12)">
    <!-- Left bar -->
    <rect x="0" y="0" width="4" height="16" fill="white"/>
    <!-- Right bar -->
    <rect x="8" y="0" width="4" height="16" fill="white"/>
    <!-- Top middle bar -->
    <rect x="4" y="2" width="4" height="4" fill="white"/>
    <!-- Bottom middle bar -->
    <rect x="4" y="10" width="4" height="4" fill="white"/>
  </g>

  <!-- Text -->
  <text x="42" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">HOSTINGER</text>
  <text x="42" y="42" font-family="Arial, sans-serif" font-size="11" fill="white">Partner</text>
</svg>
